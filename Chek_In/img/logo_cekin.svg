<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Logo Cek-In">
  <title>Cek-In</title>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset=".55" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset=".5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#0F172A" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- bayangan lantai -->
  <ellipse cx="64" cy="118" rx="44" ry="6" fill="#0F172A" opacity=".28" filter="url(#soft)"/>

  <!-- badan timbul: lapisan sisi (ekstrusi) -->
  <rect x="12" y="16" width="104" height="100" rx="28" fill="#1E1B4B"/>
  <rect x="12" y="13" width="104" height="100" rx="28" fill="#312E81"/>
  <!-- muka -->
  <rect x="12" y="8" width="104" height="100" rx="28" fill="url(#face)"/>
  <!-- bevel tepi -->
  <rect x="13.5" y="9.5" width="101" height="97" rx="26.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- kilap atas -->
  <path d="M40 10h48a26 26 0 0 1 26 26v6C96 50 32 50 14 42v-6a26 26 0 0 1 26-26z" fill="url(#gloss)"/>

  <!-- lembar naskah timbul -->
  <g filter="url(#drop)">
    <path d="M38 26h34l14 14v46a6 6 0 0 1-6 6H38a6 6 0 0 1-6-6V32a6 6 0 0 1 6-6z" fill="#CBD5E1" transform="translate(0 3)"/>
    <path d="M38 26h34l14 14v46a6 6 0 0 1-6 6H38a6 6 0 0 1-6-6V32a6 6 0 0 1 6-6z" fill="url(#paper)"/>
    <path d="M72 26v10a4 4 0 0 0 4 4h10z" fill="#93C5FD"/>
    <rect x="41" y="46" width="30" height="5" rx="2.5" fill="#4338CA"/>
    <rect x="41" y="56" width="36" height="4" rx="2" fill="#94A3B8"/>
    <rect x="41" y="64" width="26" height="4" rx="2" fill="#94A3B8"/>
  </g>

  <!-- segel centang timbul -->
  <g filter="url(#drop)">
    <circle cx="86" cy="84" r="19" fill="#92400E"/>
    <circle cx="86" cy="80.5" r="19" fill="url(#seal)" stroke="#ffffff" stroke-width="3"/>
    <path d="M86 64.5a16 16 0 0 1 15.4 11.6" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="2.4" stroke-linecap="round"/>
    <path d="m77.5 81 6 6 11-11.5" fill="none" stroke="#78350F" stroke-opacity=".45" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 1.6)"/>
    <path d="m77.5 81 6 6 11-11.5" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
