services:
  risetku-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: risetku-app
    restart: unless-stopped
    ports:
      # KEAMANAN TINGGI & TIDAK BENTROK DENGAN APLIKASI LAIN DI VPS:
      # Port 8585 terisolasi ke localhost (127.0.0.1) dan aman dari ransomware.
      - "127.0.0.1:8585:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
    security_opt:
      # Mencegah eskalasi hak akses (privilege escalation) jika terjadi eksploitasi
      - no-new-privileges:true
    volumes:
      # Hanya folder penyimpanan dokumen terjemahan sementara yang dipersistensikan
      - risetku_doc_in:/app/Penerjemah_Dokumen/Masukan
      - risetku_doc_out:/app/Penerjemah_Dokumen/Hasil_Terjemahan

volumes:
  risetku_doc_in:
    driver: local
  risetku_doc_out:
    driver: local
